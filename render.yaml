services:
  - type: web
    name: wiseview
    runtime: python
    plan: starter
    branch: krish-core
    rootDir: wiseview
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wv.www.unoverse:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
