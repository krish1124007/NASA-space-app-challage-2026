services:
  - type: web
    name: wiseview
    runtime: python
    plan: starter
    rootDir: wiseview
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wv.www.unoverse:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: WV_DATA_DIR
        value: /var/data
    disk:
      name: wiseview-data
      mountPath: /var/data
      sizeGB: 1
