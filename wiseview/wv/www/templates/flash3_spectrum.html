<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WiseView Spectrum</title>
  <link rel="stylesheet" type="text/css" href="static/flash3-theme.css?v={{ config.get('ASSET_VERSION', '1') }}">
  <style>
    .spectrum-wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .spectrum-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .spectrum-controls label { font-size: 11px; color: #7D8A99; }
    .spectrum-controls input, .spectrum-controls select { background: #0E1620; border: 1px solid #1B2533; color: #C9D1D9; padding: 4px 6px; font-family: inherit; font-size: 11px; }
    .spectrum-status { font-size: 11px; color: #7D8A99; margin-bottom: 8px; }
    svg.spectrum { width: 100%; height: 420px; background: #070B0E; border: 1px solid #1B2533; }
  </style>
</head>
<body>
  <div class="spectrum-wrap">
    <h1 style="font-size:16px; margin-bottom:4px;">SPHEREx 102-Channel Spectrum</h1>
    <p class="spectrum-status" id="status">Loading...</p>

    <div class="spectrum-controls">
      <label>RA <input type="text" id="raInput" size="10"></label>
      <label>Dec <input type="text" id="decInput" size="10"></label>
      <label>Detector filter
        <select id="detFilter">
          <option value="all">All</option>
          <option value="D1">D1</option>
          <option value="D2">D2</option>
          <option value="D3">D3</option>
          <option value="D4">D4</option>
          <option value="D5">D5</option>
          <option value="D6">D6</option>
        </select>
      </label>
      <label><input type="checkbox" id="showSynthetic" checked> Synthetic model</label>
      <label><input type="checkbox" id="showReal" checked> Real cached cutouts</label>
      <button id="loadBtn" style="padding:4px 10px; background:#1B2533; color:#C9D1D9; border:1px solid #2A3647; cursor:pointer;">Load</button>
      <a id="viewerLink" href="/legacy/viewer" style="font-size:11px; color:#8AB4E0;">Back to viewer</a>
    </div>

    <svg class="spectrum" id="chart" viewBox="0 0 900 420"></svg>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ra0 = params.get('ra') || '210.802270';
    const dec0 = params.get('dec') || '54.348950';
    const size0 = params.get('size') || '600';
    const det0 = params.get('detector') || '';

    const raInput = document.getElementById('raInput');
    const decInput = document.getElementById('decInput');
    raInput.value = ra0;
    decInput.value = dec0;

    const colors = { D1:'#8AB4E0', D2:'#5EEAD4', D3:'#A78BFA', D4:'#F59E0B', D5:'#F87171', D6:'#34D399' };

    async function load() {
      const ra = parseFloat(raInput.value);
      const dec = parseFloat(decInput.value);
      const status = document.getElementById('status');
      status.textContent = 'Loading...';
      let synth = null, real = null;
      try {
        const r1 = await fetch(`/api/spectrum?ra=${ra}&dec=${dec}`);
        if (r1.ok) synth = await r1.json();
      } catch (e) { console.error(e); }
      try {
        const r2 = await fetch(`/api/spectrum/real?ra=${ra}&dec=${dec}`);
        if (r2.ok) real = await r2.json();
      } catch (e) { console.error(e); }
      status.textContent = `Synthetic: ${synth ? synth.valid_channels_count + ' ch' : 'n/a'} | Real cached points: ${real ? real.n_points : 0}`;
      draw(synth, real);
    }

    function draw(synth, real) {
      const svg = document.getElementById('chart');
      svg.innerHTML = '';
      const W = 900, H = 420, pad = {t:30,r:20,b:45,l:60};
      const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
      const xmin = 0.75, xmax = 5.00;
      const allFlux = [];
      if (synth && document.getElementById('showSynthetic').checked) synth.channels.forEach(c => { if (c.flux_mjy != null) allFlux.push(c.flux_mjy); });
      if (real && document.getElementById('showReal').checked) real.points.forEach(p => allFlux.push(p.flux_mjy));
      const ymax = allFlux.length ? Math.max(...allFlux) * 1.15 : 10;
      const ymin = 0;
      const X = w => pad.l + (w - xmin)/(xmax - xmin)*pw;
      const Y = f => pad.t + ph - (f - ymin)/(ymax - ymin)*ph;

      // axes
      const ns = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, text) {
        const e = document.createElementNS(ns, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text) e.textContent = text;
        return e;
      }
      svg.appendChild(el('line', {x1:pad.l,y1:pad.t+ph,x2:pad.l+pw,y2:pad.t+ph, stroke:'#1B2533'}));
      svg.appendChild(el('line', {x1:pad.l,y1:pad.t,x2:pad.l,y2:pad.t+ph, stroke:'#1B2533'}));
      // x ticks
      for (let w = 1.0; w <= 5.0; w += 0.5) {
        svg.appendChild(el('line', {x1:X(w),y1:pad.t+ph,x2:X(w),y2:pad.t+ph+4, stroke:'#1B2533'}));
        svg.appendChild(el('text', {x:X(w),y:pad.t+ph+16, fill:'#7D8A99', 'font-size':10, 'text-anchor':'middle'}, w.toFixed(1)));
      }
      // y ticks
      for (let i = 0; i <= 4; i++) {
        const f = ymin + (ymax - ymin)*i/4;
        svg.appendChild(el('line', {x1:pad.l-4,y1:Y(f),x2:pad.l,y2:Y(f), stroke:'#1B2533'}));
        svg.appendChild(el('text', {x:pad.l-8,y:Y(f)+3, fill:'#7D8A99', 'font-size':10, 'text-anchor':'end'}, f.toFixed(1)));
      }
      svg.appendChild(el('text', {x:pad.l+pw/2, y:H-8, fill:'#7D8A99', 'font-size':11, 'text-anchor':'middle'}, 'Wavelength (um)'));
      svg.appendChild(el('text', {x:14, y:pad.t+ph/2, fill:'#7D8A99', 'font-size':11, 'text-anchor':'middle', transform:`rotate(-90,14,${pad.t+ph/2})`}, 'Flux (mJy)'));

      const detFilter = document.getElementById('detFilter').value;

      // synthetic curve
      if (synth && document.getElementById('showSynthetic').checked) {
        let path = '';
        let inSeg = false;
        synth.channels.forEach(c => {
          if (detFilter !== 'all' && c.detector !== detFilter) return;
          if (c.flux_mjy != null && c.is_valid) {
            const x = X(c.wavelength_um), y = Y(c.flux_mjy);
            path += (inSeg ? ' L ' : ' M ') + x + ' ' + y;
            inSeg = true;
          } else { inSeg = false; }
        });
        if (path) svg.appendChild(el('path', {d:path, fill:'none', stroke:'#8AB4E0', 'stroke-width':1.5, opacity:0.8}));
      }

      // real points
      if (real && document.getElementById('showReal').checked) {
        real.points.forEach(p => {
          if (detFilter !== 'all' && p.detector !== detFilter) return;
          const col = colors[p.detector] || '#C9D1D9';
          const c = el('circle', {cx:X(p.wavelength_um), cy:Y(p.flux_mjy), r:3.5, fill:col, stroke:'#05080D', 'stroke-width':0.5});
          c.setAttribute('title', `${p.detector} ${p.wavelength_um} um  ${p.flux_mjy} mJy`);
          svg.appendChild(c);
          if (p.flux_err_mjy) {
            svg.appendChild(el('line', {x1:X(p.wavelength_um), y1:Y(p.flux_mjy-p.flux_err_mjy), x2:X(p.wavelength_um), y2:Y(p.flux_mjy+p.flux_err_mjy), stroke:col, 'stroke-width':1, opacity:0.6}));
          }
        });
      }

      // feature lines
      const features = synth ? synth.reference_features : [];
      features.forEach(f => {
        const x = X(f.wavelength_um);
        svg.appendChild(el('line', {x1:x,y1:pad.t,x2:x,y2:pad.t+ph, stroke:'#2A3647', 'stroke-dasharray':'3,3'}));
        svg.appendChild(el('text', {x:x+2, y:pad.t+10, fill:'#7D8A99', 'font-size':9}, f.name));
      });
    }

    document.getElementById('loadBtn').addEventListener('click', load);
    document.getElementById('detFilter').addEventListener('change', load);
    document.getElementById('showSynthetic').addEventListener('change', load);
    document.getElementById('showReal').addEventListener('change', load);
    load();
  </script>
</body>
</html>
